org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Budowa 4 wariantów release naraz (arm64, armv7, universal, x64) kompiluje Kotlin równolegle w jednym demonie;
# przy domyślnym 1 GB demon kończył się "GC overhead limit exceeded" (compileArm64ReleaseKotlin).
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
android.useAndroidX=true
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true

# Publiczne repozytorium GitHub z wydaniami APK.
UPDATE_REPOSITORY=emmunioo/lewicowyt
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# AGP 9.0 domyślnie tworzy zadania testów jednostkowych tylko dla build type
# ustawionego jako testBuildType (domyślnie "debug"). CI (.github/workflows/
# android.yml) uruchamia testDebugUnitTest ORAZ testReleaseUnitTest od 1.0-beta,
# a bez tej flagi to drugie zadanie w ogóle nie istnieje w AGP 9.3.1.
android.onlyEnableUnitTestForTheTestedBuildType=false
