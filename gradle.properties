org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.overridePathCheck=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true

# Publiczne repozytorium GitHub z wydaniami APK.
UPDATE_REPOSITORY=emmunioo/lewicowyt
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# AGP 9.0 domyślnie tworzy zadania testów jednostkowych tylko dla build type
# ustawionego jako testBuildType (domyślnie "debug"). CI (.github/workflows/
# android.yml) uruchamia testDebugUnitTest ORAZ testReleaseUnitTest od 1.0-beta,
# a bez tej flagi to drugie zadanie w ogóle nie istnieje w AGP 9.3.1.
android.onlyEnableUnitTestForTheTestedBuildType=false
