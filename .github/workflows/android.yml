name: Android checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install required SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Gradle cache and validation
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint and build debug and release
        run: >-
          ./gradlew --no-daemon --max-workers=2
          :app:testDebugUnitTest :app:testReleaseUnitTest
          :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleRelease
