name: Android checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # domyślnie akcja instaluje pakiet "tools", którego nowe cmdline-tools już nie mają ("Failed to find package 'tools'")
          packages: ""

      - name: Install required SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Gradle cache and validation
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # A-54: app/google-services.json nie jest w repozytorium (.gitignore) — w CI odtwarzamy go z sekretu
      # repozytorium GOOGLE_SERVICES_JSON (pełna treść pliku). Bez sekretu używamy app/google-services.json.example.
      - name: google-services.json z sekretu
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            # bez sekretu (np. fork) budujemy z plikiem PRZYKŁADOWYM — wystarcza do testów, lintu i kompilacji, nie do działającego FCM
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Test, lint and build debug and release
        run: >-
          ./gradlew --no-daemon --max-workers=2
          :app:test :app:lint
          :app:assembleDebug :app:assembleRelease
